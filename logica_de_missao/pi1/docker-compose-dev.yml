services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: pi_timescale
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${carro_do_ovo_2025}
    ports:
      - '5433:5432'
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - app_network

  next-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # Sua aplicação Next.js roda na porta externa 3001
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - timescaledb
    networks:
      - app_network
    user: root

networks:
  app_network:
    driver: bridge

volumes:
  timescaledb_data: